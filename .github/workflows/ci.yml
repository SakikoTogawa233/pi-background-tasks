name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; no job here needs write access.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Never hide a platform-specific failure behind a faster one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` requires the committed lockfile and installs exactly it.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Docs freshness gate
        run: npm run docs:verify

      - name: Type-safety standard
        run: npm run test:type-safety

      # Fails if Windows compatibility work leaks onto macOS/Linux behaviour.
      - name: POSIX invariance
        if: runner.os != 'Windows'
        run: npx tsx --test tests/unit/posix-invariance.test.ts

      - name: Prime offline packed-install cache
        run: npm run cache:prime-packed-install

      # The default gate: unit, SDK, RPC, component, and package suites.
      - name: Default test gate
        run: npm test
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'

      - name: Scripted-provider agent loop
        run: npm run test:agent-loop
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'

      - name: Pack contents
        run: npm run pack:dry-run

      - name: Set up pnpm 11.18.0 for exotic-subdependency regression
        if: runner.os == 'Linux' && matrix.node == '22.19.0'
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Pnpm packed-install supply-chain regression
        if: runner.os == 'Linux' && matrix.node == '22.19.0'
        run: npm run test:pnpm-pack

  windows-integration:
    name: Windows integration · Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Git Bash ships with the Windows runner image and is required by the
      # opt-in PI_BG_SHELL=bash coverage. Locate it explicitly rather than
      # assuming a path, and fail loudly if it is absent.
      - name: Locate Git Bash
        shell: pwsh
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path $bash)) {
            Write-Error "Git Bash not found at $bash"
            exit 1
          }
          "PI_BG_TEST_BASH=$bash" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Git Bash: $bash"

      # Real-Windows behaviour that cannot be proven on POSIX: npm .cmd shim
      # avoidance, cmd.exe quoting, PATHEXT resolution, process-tree teardown,
      # and single-handle fsync durability on NTFS.
      - name: Windows-only integration suite
        run: npm run test:windows
        env:
          PI_OFFLINE: '1'
          PI_SKIP_VERSION_CHECK: '1'
          PI_TELEMETRY: '0'
          CI: '1'
